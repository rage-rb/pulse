name: Ruby CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'demo/**'
      - 'js/**'
  pull_request:
    paths-ignore:
      - 'demo/**'
      - 'js/**'

permissions:
  contents: read

jobs:
  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rspec
      - run: bundle exec standardrb
